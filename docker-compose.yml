services:
  web:
    build: .
    container_name: shoply-web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: shopuser
      DB_PASSWORD: shoppass
      DB_NAME: shopdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

  db:
    image: mysql:8.4
    container_name: shoply-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shop-network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

networks:
  shop-network:
    driver: bridge
